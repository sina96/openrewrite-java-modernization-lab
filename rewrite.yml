type: specs.openrewrite.org/v1beta/recipe
name: com.example.openrewrite.V1SpringBoot3Migration
displayName: V1 Spring Boot 3 Migration
description: Migrate the V1 Spring Boot 2.7 sample app to Spring Boot 3.5 and clean up Java code.
recipeList:
  - org.openrewrite.java.spring.boot3.UpgradeSpringBoot_3_5
  - org.openrewrite.java.RemoveUnusedImports
  - org.openrewrite.java.format.AutoFormat
---
type: specs.openrewrite.org/v1beta/recipe
name: com.example.openrewrite.V2Java17Migration
displayName: V2 Java 8 to Java 17 Migration
description: Migrate the plain Java module from Java 8 to Java 17 and clean up Java code.
recipeList:
  - org.openrewrite.java.migrate.UpgradeToJava17
  - org.openrewrite.maven.ChangePropertyValue:
      key: maven.compiler.source
      newValue: 17
  - org.openrewrite.maven.ChangePropertyValue:
      key: maven.compiler.target
      newValue: 17
  - org.openrewrite.java.testing.junit5.JUnit4to5Migration
  - org.openrewrite.java.RemoveUnusedImports
  - org.openrewrite.java.format.AutoFormat
---
type: specs.openrewrite.org/v1beta/recipe
name: com.example.openrewrite.V3SpringFramework6Migration
displayName: V3 Spring Framework 6 Migration
description: Migrate the non-Boot Spring Framework 5 module to Spring Framework 6 and clean up Java code.
recipeList:
  - org.openrewrite.java.spring.framework.UpgradeSpringFramework_6_2
  - org.openrewrite.java.RemoveUnusedImports
  - org.openrewrite.java.format.AutoFormat
